---
name: Lint Code Base

on: # yamllint disable-line rule:truthy
  push: null
  pull_request: null

permissions: {}
jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        # uses: super-linter/super-linter/slim@12150456a73e248bdc94d0794898f94e23127c88 # 7.4.0
        uses: super-linter/super-linter/slim@d5b0a2ab116623730dd094f15ddc1b6b25bf7b99 # v8.3.2
        # Can't move on to super-linter v8.x yet due to Drupal core still using airbnb-base eslint config
        # https://www.drupal.org/project/drupal/issues/3440225
        # https://github.com/super-linter/super-linter/blob/main/docs/upgrade-guide.md#removed-eslint-plugins-and-configurations
        # oops on 11.3 eslint-plugin-jsdoc
        # https://www.drupal.org/project/drupal/issues/3269001#comment-16391313

        env:
          LINTER_RULES_PATH: .github/linters
          VALIDATE_BIOME_FORMAT: false
          VALIDATE_JAVASCRIPT_PRETTIER: false
          VALIDATE_JSCPD: false
          VALIDATE_JSON_PRETTIER: false
          VALIDATE_PHP_PSALM: false
          # YAML is validated via eslint plugin for Drupal
          VALIDATE_YAML_PRETTIER: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
